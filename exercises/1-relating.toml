# Lesson 1: Relating (CS50 SQL, lecture 1). Database: normalized `kvv`.

[[exercise]]
id = "1.1"
lesson = 1
title = "Eine Tabelle, ein Schlüssel"
db = "kvv"
task = "Gib den Namen aller Haltestellen aus, die barrierefrei sind (`wheelchair = 1`), alphabetisch."
hint = "Die Tabelle `stops` hat die Spalte `wheelchair`."
ordered = true
solution = "SELECT name FROM stops WHERE wheelchair = 1 ORDER BY name;"

[[exercise]]
id = "1.2"
lesson = 1
title = "Subquery"
db = "kvv"
task = "Welche Haltestellen bedient die Linie `3`? Nur die Namen, in Fahrtreihenfolge (`position`). Löse es mit einer Subquery: erst die `id` der Linie, dann `line_stops`."
hint = "WHERE line_id = (SELECT id FROM lines WHERE name = '3')"
ordered = true
solution = """
SELECT stops.name
FROM stops
WHERE id IN (
    SELECT stop_id FROM line_stops
    WHERE line_id = (SELECT id FROM lines WHERE name = '3')
)
ORDER BY (SELECT position FROM line_stops
          WHERE line_stops.stop_id = stops.id
            AND line_stops.line_id = (SELECT id FROM lines WHERE name = '3'));
"""

[[exercise]]
id = "1.3"
lesson = 1
title = "JOIN"
db = "kvv"
task = "Dasselbe wie 1.2, aber mit `JOIN`: Linie `3`, Haltestellennamen in Fahrtreihenfolge."
hint = "lines JOIN line_stops ON ... JOIN stops ON ..."
ordered = true
solution = """
SELECT stops.name
FROM lines
JOIN line_stops ON line_stops.line_id = lines.id
JOIN stops ON stops.id = line_stops.stop_id
WHERE lines.name = '3'
ORDER BY line_stops.position;
"""

[[exercise]]
id = "1.4"
lesson = 1
title = "Knotenpunkte"
db = "kvv"
task = "Welche Haltestellen werden von mehr als einer Linie bedient? Spalten: Haltestellenname, Anzahl der Linien (`lines_count`). Absteigend nach Anzahl, dann nach Name."
hint = "JOIN + GROUP BY + HAVING COUNT(...) > 1"
ordered = true
solution = """
SELECT stops.name, COUNT(*) AS lines_count
FROM stops
JOIN line_stops ON line_stops.stop_id = stops.id
GROUP BY stops.id
HAVING COUNT(*) > 1
ORDER BY lines_count DESC, stops.name;
"""

[[exercise]]
id = "1.5"
lesson = 1
title = "Verspätung je Linie"
db = "kvv"
task = "Durchschnittliche Verspätung je Linie (Linienname, auf 2 Nachkommastellen gerundet), schlechteste Linie zuerst, bei Gleichstand nach Name."
hint = "stop_events -> trips -> lines"
ordered = true
solution = """
SELECT lines.name, ROUND(AVG(stop_events.delay_min), 2) AS avg_delay
FROM stop_events
JOIN trips ON trips.id = stop_events.trip_id
JOIN lines ON lines.id = trips.line_id
GROUP BY lines.id
ORDER BY avg_delay DESC, lines.name;
"""

[[exercise]]
id = "1.6"
lesson = 1
title = "LEFT JOIN"
db = "kvv"
task = "Welche Haltestellen wurden noch nie angefahren (kein einziger `stop_events`-Eintrag)? Liste ihre Namen. (Tipp: `LEFT JOIN` und `IS NULL`.)"
hint = "stops LEFT JOIN stop_events ON ... WHERE stop_events.id IS NULL"
solution = """
SELECT stops.name
FROM stops
LEFT JOIN stop_events ON stop_events.stop_id = stops.id
WHERE stop_events.id IS NULL;
"""
